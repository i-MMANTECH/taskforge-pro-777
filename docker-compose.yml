services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: taskforge_db
      POSTGRES_USER: taskforge_user
      POSTGRES_PASSWORD: your_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://taskforge_user:your_secure_password@db:5432/taskforge_db
      - JWT_SECRET=your_super_secret_key_here

volumes:
  postgres_data: